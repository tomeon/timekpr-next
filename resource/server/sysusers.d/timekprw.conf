# The user timekprw.service runs as.  It is a member of the timekpr
# group because the daemon asks polkit, whose rule for that group
# (50-timekpr.rules / timekpr.pkla) looks membership up through NSS; a
# supplementary group set only on the process would not be seen.
g timekpr -
u timekprw - "Timekpr-nExT web front end"
m timekprw timekpr
